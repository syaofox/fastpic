<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/static/assets/styles.css">
    <script src="/static/js/htmx.min.js" defer></script>
    <script src="/static/js/mpegts.min.js" defer></script>
    <script src="/static/js/utils.js" defer></script>
    <script src="/static/js/folder-browser.js" defer></script>
    <title>{% block title %}FastPic 图片/视频查看器{% endblock %}</title>
    <style>
        /* 侧边栏：细窄滚动条，浅色主题 */
        #sidebar {
            scrollbar-width: thin;
            scrollbar-color: rgb(203 213 225) transparent;
        }
        /* 移动端：侧边栏打开时占 85vw，便于点击遮罩关闭 */
        @media (max-width: 767px) {
            #sidebar:not(.hidden) {
                width: 85vw !important;
                max-width: 85vw !important;
            }
        }
        #sidebar::-webkit-scrollbar {
            width: 6px;
        }
        #sidebar::-webkit-scrollbar-track {
            background: transparent;
        }
        #sidebar::-webkit-scrollbar-thumb {
            background: rgb(203 213 225);
            border-radius: 3px;
        }
        #sidebar::-webkit-scrollbar-thumb:hover {
            background: rgb(148 163 184);
        }

        /* 主区：细窄滚动条，浅色主题 */
        #scroll-container {
            scrollbar-width: thin;
            scrollbar-color: rgb(203 213 225) transparent;
        }
        #scroll-container::-webkit-scrollbar {
            width: 6px;
        }
        #scroll-container::-webkit-scrollbar-track {
            background: transparent;
        }
        #scroll-container::-webkit-scrollbar-thumb {
            background: rgb(203 213 225);
            border-radius: 3px;
        }
        #scroll-container::-webkit-scrollbar-thumb:hover {
            background: rgb(148 163 184);
        }

        /* 列表模式：单列，每行缩略图+信息 */
        #gallery-grid.gallery-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        #gallery-grid.gallery-list .selectable-item {
            width: 100%;
            content-visibility: auto;
            contain-intrinsic-size: auto 100px;
        }

        /* 瀑布流：JS 列布局 */
        #wf-row {
            display: flex;
            align-items: flex-start;
        }
        #wf-row > .wf-col {
            flex: 1;
            min-width: 0;
        }
        /* 瀑布流 item 视口外跳过渲染，提升长列表滚动帧率 */
        #wf-row .wf-col .selectable-item {
            content-visibility: auto;
            contain-intrinsic-size: auto 200px;
        }

        /* 文件夹模式：Flexbox 布局，避免 Grid 空单元格产生大面积空白 */
        #gallery-grid.gallery-flex {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }
        /* 使用 data-cols 避免 calc+var 在部分浏览器失效，JS 会在加载后同步 */
        #gallery-grid.gallery-flex .selectable-item {
            flex: 0 0 auto;
            min-width: 0;
            width: calc(25% - 0.75rem); /* 默认 4 列 */
            /* 仅对 border/shadow 做过渡，避免列数变化时 width 产生缩小动画 */
            transition: border-color 0.2s, box-shadow 0.2s;
            /* 视口外元素跳过渲染，提升长列表滚动帧率 */
            content-visibility: auto;
            contain-intrinsic-size: auto 200px;
        }
        #gallery-grid.gallery-flex[data-cols="2"] .selectable-item { width: calc(50% - 0.5rem); }
        #gallery-grid.gallery-flex[data-cols="3"] .selectable-item { width: calc(33.333% - 0.667rem); }
        #gallery-grid.gallery-flex[data-cols="4"] .selectable-item { width: calc(25% - 0.75rem); }
        #gallery-grid.gallery-flex[data-cols="5"] .selectable-item { width: calc(20% - 0.8rem); }
        #gallery-grid.gallery-flex[data-cols="6"] .selectable-item { width: calc(16.666% - 0.833rem); }
        #gallery-grid.gallery-flex[data-cols="7"] .selectable-item { width: calc(14.285% - 0.857rem); }
        #gallery-grid.gallery-flex[data-cols="8"] .selectable-item { width: calc(12.5% - 0.875rem); }
        #gallery-grid.gallery-flex > .folder-image-separator,
        #gallery-grid.gallery-flex > .scroll-sentinel {
            flex: 0 0 100%;
            width: 100%;
        }
        /* 滚动哨兵负边距消除与上一行之间的可见间隙 */
        #gallery-grid.gallery-flex > .scroll-sentinel {
            margin-top: -0.25rem;
        }
        /* 无限滚动加载指示器 */
        #infinite-scroll-loading.htmx-indicator { opacity: 0; transition: opacity 0.2s; pointer-events: none; }
        #infinite-scroll-loading.htmx-indicator.htmx-request { opacity: 1; }
        #gallery-grid.gallery-flex > #infinite-scroll-loading,
        #gallery-grid.gallery-list > #infinite-scroll-loading { flex: 0 0 100%; width: 100%; }

        /* 响应式：按断点限制最大列数 */
        /* 手机 < 640px：最多 2 列 */
        @media (max-width: 639px) {
            #gallery-grid.gallery-flex[data-cols="3"] .selectable-item,
            #gallery-grid.gallery-flex[data-cols="4"] .selectable-item,
            #gallery-grid.gallery-flex[data-cols="5"] .selectable-item,
            #gallery-grid.gallery-flex[data-cols="6"] .selectable-item,
            #gallery-grid.gallery-flex[data-cols="7"] .selectable-item,
            #gallery-grid.gallery-flex[data-cols="8"] .selectable-item {
                width: calc(50% - 0.5rem);
            }
        }
        /* sm 640px–767px：最多 3 列 */
        @media (min-width: 640px) and (max-width: 767px) {
            #gallery-grid.gallery-flex[data-cols="4"] .selectable-item,
            #gallery-grid.gallery-flex[data-cols="5"] .selectable-item,
            #gallery-grid.gallery-flex[data-cols="6"] .selectable-item,
            #gallery-grid.gallery-flex[data-cols="7"] .selectable-item,
            #gallery-grid.gallery-flex[data-cols="8"] .selectable-item {
                width: calc(33.333% - 0.667rem);
            }
        }
        /* md 768px–1023px：最多 4 列 */
        @media (min-width: 768px) and (max-width: 1023px) {
            #gallery-grid.gallery-flex[data-cols="5"] .selectable-item,
            #gallery-grid.gallery-flex[data-cols="6"] .selectable-item,
            #gallery-grid.gallery-flex[data-cols="7"] .selectable-item,
            #gallery-grid.gallery-flex[data-cols="8"] .selectable-item {
                width: calc(25% - 0.75rem);
            }
        }
        /* lg 1024px–1279px：最多 6 列 */
        @media (min-width: 1024px) and (max-width: 1279px) {
            #gallery-grid.gallery-flex[data-cols="7"] .selectable-item,
            #gallery-grid.gallery-flex[data-cols="8"] .selectable-item {
                width: calc(16.666% - 0.833rem);
            }
        }
        /* 切换文件夹时的加载指示器：延迟 150ms 显示，避免快速响应时闪烁 */
        #gallery-loading-indicator.htmx-indicator { opacity: 0; transition: opacity 0.2s; }
        #gallery-loading-indicator.htmx-indicator.htmx-request.gallery-loading-visible { opacity: 1; }
        /* 切换文件夹时 gallery 容器淡入淡出过渡 */
        #gallery-container { transition: opacity 0.15s ease; }
        #gallery-container.gallery-swapping { opacity: 0.6; }

        /* 模态框淡入淡出过渡 */
        #modal { transition: opacity 0.2s ease; opacity: 0; pointer-events: none; visibility: hidden; }
        #modal.modal-open { opacity: 1; pointer-events: auto; visibility: visible; }
        /* 大图切换时淡入，避免白屏 */
        #modal-img { transition: opacity 0.15s ease; }
        #modal-img.modal-img-loading { opacity: 0.4; }

        /* 移动端：工具栏展开时改为双行布局，避免左右重叠 */
        @media (max-width: 767px) {
            #modal-toolbar.modal-toolbar-expanded {
                flex-direction: column;
                align-items: stretch;
                gap: 0.75rem;
            }
            #modal-toolbar.modal-toolbar-expanded > div:last-child {
                flex-wrap: wrap;
                justify-content: flex-end;
                gap: 0.5rem;
            }
        }

        /* 上传处理中：indeterminate 动画，避免用户误以为卡死 */
        @keyframes upload-indeterminate {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        #upload-progress-bar.upload-progress-indeterminate {
            position: relative;
            width: 100% !important;
            overflow: hidden;
        }
        #upload-progress-bar.upload-progress-indeterminate::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.4) 50%, transparent 100%);
            animation: upload-indeterminate 1.2s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <!-- 后台扫描提示条 -->
    <div id="scan-banner" class="hidden px-4 py-2 bg-amber-50 border-b border-amber-200 text-amber-800 text-sm flex items-center justify-center gap-2">
        <svg class="animate-spin h-4 w-4 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" aria-hidden="true">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>正在扫描媒体库，新媒体将陆续显示…</span>
    </div>
    {% block content %}{% endblock %}
    <!-- 通用确认弹窗（主站与设置页复用） -->
    <div id="global-confirm-overlay" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 bg-black/40" onclick="if(event.target===this)closeGlobalConfirm()">
        <div class="bg-white rounded-xl shadow-2xl max-w-sm w-full mx-4 p-6" onclick="event.stopPropagation()">
            <p id="global-confirm-message" class="text-slate-700 mb-6 text-center"></p>
            <div class="flex justify-center gap-3">
                <button type="button" id="global-confirm-cancel" class="px-4 py-2 rounded-lg border border-slate-300 text-slate-700 hover:bg-slate-50 text-sm font-medium transition-colors">取消</button>
                <button type="button" id="global-confirm-ok" class="px-4 py-2 rounded-lg text-white text-sm font-medium transition-colors">确定</button>
            </div>
        </div>
    </div>
    <!-- 页面内提示（替代 alert） -->
    <div id="toast-container" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-[120] flex flex-col gap-2 pointer-events-none" aria-live="polite"></div>
    
    <!-- 全局进度指示器 -->
    <div id="progress-indicator" class="fixed top-0 left-0 right-0 z-[130] hidden transform transition-transform duration-300 -translate-y-full">
        <div class="bg-slate-800 text-white px-4 py-3 shadow-lg">
            <div class="max-w-4xl mx-auto flex items-center gap-3">
                <svg id="progress-icon" class="w-5 h-5 animate-spin text-blue-400" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                </svg>
                <div class="flex-1 min-w-0">
                    <div class="flex items-center justify-between mb-1">
                        <span id="progress-title" class="text-sm font-medium truncate">正在处理...</span>
                        <span id="progress-percent" class="text-sm font-medium ml-2">0%</span>
                    </div>
                    <div class="w-full h-1.5 bg-slate-600 rounded-full overflow-hidden">
                        <div id="progress-bar" class="h-full bg-blue-500 rounded-full transition-all duration-300" style="width: 0%"></div>
                    </div>
                    <div id="progress-message" class="text-xs text-slate-400 mt-1 truncate"></div>
                </div>
                <button id="progress-close" class="p-1 hover:bg-slate-700 rounded transition-colors" title="关闭">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
    function showToast(message, type, duration) {
        type = type || 'info';
        duration = duration || 4000;
        var container = document.getElementById('toast-container');
        if (!container) {
            container = document.createElement('div');
            container.id = 'toast-container';
            container.className = 'fixed bottom-4 left-1/2 -translate-x-1/2 z-[120] flex flex-col gap-2 pointer-events-none';
            container.setAttribute('aria-live', 'polite');
            document.body.appendChild(container);
        }
        
        var iconSvg = '';
        var baseClasses = 'px-4 py-3 rounded-lg shadow-lg text-sm font-medium max-w-md flex items-center gap-2.5 ';
        var typeClasses = '';
        
        switch (type) {
            case 'success':
                typeClasses = 'bg-green-100 text-green-800 border border-green-200';
                iconSvg = '<svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';
                break;
            case 'error':
                typeClasses = 'bg-red-100 text-red-800 border border-red-200';
                iconSvg = '<svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>';
                break;
            case 'warning':
                typeClasses = 'bg-amber-100 text-amber-800 border border-amber-200';
                iconSvg = '<svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>';
                break;
            default: // info
                typeClasses = 'bg-slate-800 text-white';
                iconSvg = '<svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';
        }
        
        var el = document.createElement('div');
        el.className = baseClasses + typeClasses;
        el.innerHTML = iconSvg + '<span>' + message + '</span>';
        
        if (duration > 0) {
            setTimeout(function() {
                el.style.opacity = '0';
                el.style.transition = 'opacity 0.2s';
                setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 200);
            }, duration);
        }
        
        container.appendChild(el);
    }
    </script>
    <script>
    (function() {
    var _progressIndicator = null;
    var _progressTitle = null;
    var _progressPercent = null;
    var _progressBar = null;
    var _progressMessage = null;
    var _progressClose = null;
    var _currentTaskId = null;
    var _progressExpandTimeout = null;

    function _initProgressIndicator() {
        if (_progressIndicator) return;
        _progressIndicator = document.getElementById('progress-indicator');
        _progressTitle = document.getElementById('progress-title');
        _progressPercent = document.getElementById('progress-percent');
        _progressBar = document.getElementById('progress-bar');
        _progressMessage = document.getElementById('progress-message');
        _progressClose = document.getElementById('progress-close');
        
        if (_progressClose) {
            _progressClose.onclick = hideProgressIndicator;
        }
    }

    function showProgressIndicator(taskId, title, progress, message) {
        _initProgressIndicator();
        if (!_progressIndicator) return;
        
        _currentTaskId = taskId;
        _progressTitle.textContent = title || '正在处理...';
        _progressPercent.textContent = (progress || 0) + '%';
        _progressBar.style.width = (progress || 0) + '%';
        _progressMessage.textContent = message || '';
        
        _progressIndicator.classList.remove('hidden');
        requestAnimationFrame(function() {
            _progressIndicator.classList.remove('-translate-y-full');
        });
        
        if (_progressExpandTimeout) clearTimeout(_progressExpandTimeout);
    }

    function updateProgressIndicator(progress, message) {
        _initProgressIndicator();
        if (!_progressIndicator || _progressIndicator.classList.contains('hidden')) return;
        
        _progressPercent.textContent = Math.round(progress) + '%';
        _progressBar.style.width = progress + '%';
        if (message !== undefined) {
            _progressMessage.textContent = message;
        }
    }

    function hideProgressIndicator() {
        _initProgressIndicator();
        if (!_progressIndicator) return;
        
        _progressIndicator.classList.add('-translate-y-full');
        _currentTaskId = null;
        
        if (_progressExpandTimeout) clearTimeout(_progressExpandTimeout);
        _progressExpandTimeout = setTimeout(function() {
            if (_progressIndicator && _progressIndicator.classList.contains('-translate-y-full')) {
                _progressIndicator.classList.add('hidden');
            }
        }, 300);
    }

    function showToast(message, type, duration) {
        type = type || 'info';
        duration = duration || 4000;
        var container = document.getElementById('toast-container');
        if (!container) {
            container = document.createElement('div');
            container.id = 'toast-container';
            container.className = 'fixed bottom-4 left-1/2 -translate-x-1/2 z-[120] flex flex-col gap-2 pointer-events-none';
            container.setAttribute('aria-live', 'polite');
            document.body.appendChild(container);
        }
        
        var iconSvg = '';
        var baseClasses = 'px-4 py-3 rounded-lg shadow-lg text-sm font-medium max-w-md flex items-center gap-2.5 ';
        var typeClasses = '';
        
        switch (type) {
            case 'success':
                typeClasses = 'bg-green-100 text-green-800 border border-green-200';
                iconSvg = '<svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';
                break;
            case 'error':
                typeClasses = 'bg-red-100 text-red-800 border border-red-200';
                iconSvg = '<svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>';
                break;
            case 'warning':
                typeClasses = 'bg-amber-100 text-amber-800 border border-amber-200';
                iconSvg = '<svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>';
                break;
            default: // info
                typeClasses = 'bg-slate-800 text-white';
                iconSvg = '<svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';
        }
        
        var el = document.createElement('div');
        el.className = baseClasses + typeClasses;
        el.innerHTML = iconSvg + '<span>' + message + '</span>';
        
        if (duration > 0) {
            setTimeout(function() {
                el.style.opacity = '0';
                el.style.transition = 'opacity 0.2s';
                setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 200);
            }, duration);
        }
        
        container.appendChild(el);
    }

    /** 通用确认弹窗：message 文案，confirmText 确认按钮文字，onConfirm/onCancel 回调，opts.variant='danger' 时确认按钮为红色 */
    function showConfirm(message, confirmText, onConfirm, onCancel, opts) {
        opts = opts || {};
        var overlay = document.getElementById('global-confirm-overlay');
        var msgEl = document.getElementById('global-confirm-message');
        var cancelBtn = document.getElementById('global-confirm-cancel');
        var okBtn = document.getElementById('global-confirm-ok');
        if (!overlay || !msgEl || !okBtn) return;
        msgEl.textContent = message || '';
        okBtn.textContent = confirmText || '确定';
        okBtn.className = 'px-4 py-2 rounded-lg text-white text-sm font-medium transition-colors ' +
            (opts.variant === 'danger' ? 'bg-red-500 hover:bg-red-600' : 'bg-blue-500 hover:bg-blue-600');
        function close() {
            overlay.classList.add('hidden');
            okBtn.onclick = null;
            cancelBtn.onclick = null;
        }
        okBtn.onclick = function() {
            close();
            if (onConfirm) onConfirm();
        };
        cancelBtn.onclick = function() {
            close();
            if (onCancel) onCancel();
        };
        overlay.classList.remove('hidden');
    }
    function closeGlobalConfirm() {
        var overlay = document.getElementById('global-confirm-overlay');
        if (overlay) overlay.classList.add('hidden');
    }

    var _evtSource = null;
    var _currentTaskType = null;

    function connectTaskEvents() {
        if (_evtSource) {
            _evtSource.close();
        }
        
        // 检查是否已登录（通过检查侧边栏是否存在）
        if (!document.getElementById('sidebar')) {
            return;
        }
        
        _evtSource = new EventSource('/api/task-events');
        
        _evtSource.onmessage = function(e) {
            var data = {};
            try {
                data = JSON.parse(e.data) || {};
            } catch(err) {
                return;
            }
            
            if (!data.task_type && !data.title) return;
            
            _currentTaskType = data.task_type;
            
            if (data.is_running) {
                var title = data.title || _getTaskTitle(data.task_type);
                var message = data.message || '';
                var progress = data.progress_percent || 0;
                
                showProgressIndicator(data.task_type, title, progress, message);
            } else if (data.finished_at) {
                hideProgressIndicator();
                
                var resultType = data.error ? 'error' : 'success';
                var resultMessage = '';
                
                if (data.error) {
                    resultMessage = data.error;
                } else if (data.result) {
                    resultMessage = _formatResultMessage(data.task_type, data.result);
                } else if (data.current_operation) {
                    resultMessage = data.current_operation;
                } else {
                    resultMessage = _getTaskCompleteMessage(data.task_type);
                }
                
                var duration = data.error ? 6000 : 4000;
                if (!document.getElementById('queue-panel')) {
                    showToast(resultMessage, resultType, duration);
                }
            }
        };
        
        _evtSource.onerror = function(err) {
            console.log('SSE connection error, will retry...');
        };
    }

    function _getTaskTitle(taskType) {
        var titles = {
            'scan': '正在扫描媒体文件',
            'cleanup': '正在清理数据库',
            'full-sync': '正在完整同步',
            'scan-duplicates': '正在扫描重复文件',
            'upload': '正在上传文件',
            'delete': '正在删除文件'
        };
        return titles[taskType] || '正在处理...';
    }

    function _getTaskCompleteMessage(taskType) {
        var messages = {
            'scan': '扫描完成',
            'cleanup': '清理完成',
            'full-sync': '同步完成',
            'scan-duplicates': '重复文件扫描完成',
            'upload': '上传完成',
            'delete': '删除完成'
        };
        return messages[taskType] || '操作完成';
    }

    function _formatResultMessage(taskType, result) {
        if (!result) return '';
        
        if (taskType === 'scan' || taskType === 'full-sync') {
            var count = result.added || result.scanned || 0;
            return count + ' 个文件已处理';
        }
        if (taskType === 'cleanup') {
            var removed = result.removed || 0;
            return '已清理 ' + removed + ' 个记录';
        }
        if (taskType === 'upload') {
            var uploaded = result.uploaded || 0;
            var skipped = result.skipped || 0;
            var errors = result.errors ? result.errors.length : 0;
            if (errors > 0) {
                return uploaded + ' 个上传成功，' + skipped + ' 个跳过，' + errors + ' 个失败';
            }
            return uploaded + ' 个文件上传成功';
        }
        if (taskType === 'delete') {
            var deleted = result.deleted || 0;
            return deleted + ' 个文件已删除';
        }
        
        return JSON.stringify(result);
    }

    connectTaskEvents();
    })();
    </script>
    <script>
    (function() {
        var banner = document.getElementById('scan-banner');
        var pollInterval = 2500;
        var pollTimer = null;

        function updateBanner(scanning) {
            if (scanning) {
                banner.classList.remove('hidden');
            } else {
                banner.classList.add('hidden');
            }
        }

        function poll() {
            fetch('/api/scan-status')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    updateBanner(data.scanning);
                    if (!data.scanning) {
                        if (pollTimer) clearInterval(pollTimer);
                        pollTimer = null;
                        return;
                    }
                    if (!pollTimer) pollTimer = setInterval(poll, pollInterval);
                })
                .catch(function() {});
        }

        poll();
    })();
    </script>
</body>
