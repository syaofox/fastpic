[project]
name = "fastpic"
version = "0.3.9"
description = "局域网图片查看器 - FastAPI + HTMX + SQLModel"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.0",
    "sqlmodel>=0.0.14",
    "aiomysql>=0.2.0",
    "pymysql>=1.1.0",
    "cryptography>=42.0.0",
    "pillow>=11.3.0",
    "python-multipart>=0.0.6",
    "watchdog>=6.0.0",
    "opencc-python-reimplemented>=0.1.7",
    "pypinyin>=0.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
exclude = ["tests/"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
# 核心配置：确保 LSP 能找到你的虚拟环境
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

# 严格度设置：可以从 "standard" 开始，觉得太烦再调低
typeCheckingMode = "basic" 
reportMissingImports = true
reportMissingTypeStubs = false # 很多库没写 type stubs，关闭此项减少干扰