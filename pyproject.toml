[project]
name = "fastpic"
version = "0.3.8"
description = "局域网图片查看器 - FastAPI + HTMX + SQLModel"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.0",
    "sqlmodel>=0.0.14",
    "aiomysql>=0.2.0",
    "pymysql>=1.1.0",
    "cryptography>=42.0.0",
    "pillow>=11.3.0",
    "python-multipart>=0.0.6",
    "watchdog>=6.0.0",
    "opencc-python-reimplemented>=0.1.7",
    "pypinyin>=0.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
