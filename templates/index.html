{% extends "base.html" %}
{% block content %}
<!-- 刷新后提示：上次操作可能仍在进行 -->
<div id="operation-recovery-hint" class="hidden px-4 py-2 bg-blue-50 border-b border-blue-200 text-blue-800 text-sm flex items-center justify-center gap-3 flex-wrap">
    <span>上次操作可能仍在进行，请稍候再试。若已完成可忽略。</span>
    <button type="button" id="operation-recovery-dismiss" class="px-3 py-1 rounded-lg bg-blue-100 hover:bg-blue-200 text-blue-800 text-sm font-medium transition-colors">我知道了</button>
</div>
<script>
(function() {
    try {
        var raw = localStorage.getItem('fastpic_operation');
        if (!raw) return;
        var data = JSON.parse(raw);
        var age = Date.now() - (data.ts || 0);
        if (age > 5 * 60 * 1000) {
            localStorage.removeItem('fastpic_operation');
            return;
        }
        var hint = document.getElementById('operation-recovery-hint');
        var dismiss = document.getElementById('operation-recovery-dismiss');
        if (hint) hint.classList.remove('hidden');
        if (dismiss) {
            dismiss.addEventListener('click', function() {
                localStorage.removeItem('fastpic_operation');
                if (hint) hint.classList.add('hidden');
            });
        }
    } catch (e) {}
})();
</script>
<!-- 移动端侧边栏遮罩（点击关闭，sm 及以上不显示） -->
<div id="sidebar-overlay" class="hidden fixed inset-0 z-40 bg-black/40 md:hidden" onclick="toggleSidebar()" aria-hidden="true"></div>
<div class="flex h-screen" id="layout">
    <!-- 左侧文件夹树（可调节宽度，默认隐藏；移动端全屏遮罩+85vw） -->
    <aside id="sidebar" class="bg-white border-r border-slate-200 flex-shrink-0 flex flex-col hidden relative z-50" style="width: var(--sidebar-width, 220px); min-width: 160px; max-width: 800px;">
        <div class="p-4 flex-1 overflow-y-auto">
            <div class="flex items-center justify-between mb-3">
                <h2 class="font-semibold text-slate-800">全部文件夹</h2>
                <button type="button" class="p-1 rounded hover:bg-slate-100 text-slate-500" aria-label="隐藏文件夹树" title="隐藏文件夹树" onclick="toggleSidebar()">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/></svg>
                </button>
            </div>
            <div id="folder-tree" class="space-y-0"
                 hx-get="/api/sidebar-folder-tree?path={{ (request.query_params.get('path') or '')|urlencode_path }}"
                 hx-swap="innerHTML">
                <div class="flex justify-center py-4 text-slate-500 text-sm">加载文件夹树...</div>
            </div>
            {% include "partials/tag_list.html" with context %}
        </div>
        <div class="px-4 py-2 border-t border-slate-100 flex-shrink-0">
            <span class="text-xs text-slate-400">FastPic v{{ version }}</span>
        </div>
    </aside>

    <!-- 拖拽调节手柄（默认隐藏，跟随侧栏） -->
    <div id="resize-handle"
         class="flex-shrink-0 w-1.5 cursor-col-resize hover:bg-blue-100 transition-colors flex items-center justify-center group bg-slate-100 hidden"
         role="separator"
         aria-label="调节侧边栏宽度">
        <div class="w-0.5 h-8 bg-slate-400 group-hover:bg-blue-500 rounded-full opacity-60 group-hover:opacity-100 transition-opacity"></div>
    </div>

    <!-- 右侧主区 -->
    <main class="flex-1 flex flex-col overflow-hidden bg-slate-50">
        <!-- 顶部栏：两行布局 -->
        <header class="bg-white border-b border-slate-200 flex-shrink-0 flex flex-col">
            <!-- 第一行：搜索框 | AI 搜索 | 设置 -->
            <div class="flex items-center gap-2 sm:gap-3 p-3 sm:p-4 pb-0">
                <div class="flex-1 relative min-w-0" id="dir-search-wrapper">
                    <div class="flex items-center gap-2 pl-3 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus-within:ring-2 focus-within:ring-blue-500 focus-within:border-blue-500">
                        <svg class="w-5 h-5 text-slate-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                        <input type="hidden" name="path" id="path-input" value="{{ request.query_params.get('path', '') or '' }}">
                        <input type="hidden" name="mode" id="mode-input" value="{{ request.query_params.get('mode', 'folder') }}">
                        <input type="hidden" name="cols" id="cols-input" value="4">
                        <input type="hidden" name="sort_by" id="sort-by-input" value="modified_at">
                        <input type="hidden" name="sort_order" id="sort-order-input" value="desc">
                        <input type="search"
                               id="dir-search-input"
                               placeholder="搜索文件夹路径，如：2024、旅行、厦门..."
                               autocomplete="off"
                               class="flex-1 min-w-0 bg-transparent border-none focus:outline-none focus:ring-0 text-slate-800 placeholder-slate-400">
                    </div>
                    <div id="dir-search-dropdown" class="hidden absolute left-0 right-0 top-full mt-1 z-50 bg-white rounded-lg shadow-lg border border-slate-200 max-h-80 overflow-y-auto">
                    </div>
                </div>
                <button type="button" class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white text-sm font-medium rounded-lg transition-colors flex-shrink-0">AI 搜索</button>
                <a href="/settings" class="p-2 rounded-lg hover:bg-slate-100 text-slate-500 hover:text-slate-700 transition-colors flex-shrink-0" title="设置"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg></a>
            </div>
            <!-- 第二行：侧边栏按钮 | 面包屑 + 操作按钮 -->
            <div class="flex items-center gap-2 sm:gap-3 px-3 sm:px-4 py-3">
                <button type="button" id="sidebar-toggle-btn"
                        class="p-2 rounded-lg hover:bg-slate-100 text-slate-500 hover:text-slate-700 transition-colors flex-shrink-0"
                        title="显示/隐藏文件夹树"
                        onclick="toggleSidebar()">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
                </button>
                <div id="gallery-top-slot" class="flex-1 min-w-0 overflow-hidden"></div>
            </div>
        </header>

        <!-- 图片网格 -->
        <div class="flex-1 overflow-y-auto p-3 sm:p-4 transition-[padding] duration-200 relative" id="scroll-container">
            <div id="gallery-loading-indicator" class="htmx-indicator absolute inset-0 flex items-center justify-center bg-slate-50/90 z-10 pointer-events-none">
                <div class="flex items-center gap-2 text-slate-500">
                    <svg class="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24" aria-hidden="true">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span class="text-sm">加载中...</span>
                </div>
            </div>
            <div id="gallery-container"
                 hx-get="/gallery?path={{ (request.query_params.get('path') or '')|urlencode_path }}&search=&mode={{ request.query_params.get('mode', 'folder') }}&sort_by={{ request.query_params.get('sort_by', 'modified_at') }}&sort_order={{ request.query_params.get('sort_order', 'desc') }}&page=1&cols=4{% if not (request.query_params.get('path') or '') %}&defer_subfolders=1{% endif %}"
                 hx-trigger="load"
                 hx-swap="innerHTML"
                 hx-include="#cols-input, #sort-by-input, #sort-order-input">
                <div class="flex justify-center items-center h-64 text-slate-500">
                    <span class="htmx-indicator">加载中...</span>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- 批量选择时底部固定操作栏（滚动后删除按钮始终可见） -->
<div id="select-mode-fab" class="hidden fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-slate-200 shadow-[0_-4px_12px_rgba(0,0,0,0.08)] px-3 py-3 sm:px-4 flex items-center justify-between gap-2 sm:gap-4">
    <span id="select-mode-fab-count" class="text-sm font-medium text-slate-700">已选 0 项</span>
    <div class="flex items-center gap-2 flex-wrap sm:flex-nowrap">
        <button type="button" id="select-mode-fab-move" class="hidden px-3 py-2 sm:px-4 rounded-lg bg-blue-500 hover:bg-blue-600 text-white text-sm font-medium transition-colors flex items-center gap-1.5" onclick="window.showMoveDialog && window.showMoveDialog()">
            <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
            <span class="hidden sm:inline">移动</span>
        </button>
        <button type="button" id="select-mode-fab-rename" class="hidden px-3 py-2 sm:px-4 rounded-lg bg-blue-500 hover:bg-blue-600 text-white text-sm font-medium transition-colors flex items-center gap-1.5" onclick="window.showRenameDialog && window.showRenameDialog()">
            <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
            <span class="hidden sm:inline">重命名</span>
        </button>
        <button type="button" id="select-mode-fab-download" class="px-3 py-2 sm:px-4 rounded-lg bg-slate-600 hover:bg-slate-700 text-white text-sm font-medium transition-colors flex items-center gap-1.5" onclick="window.downloadSelected && window.downloadSelected()">
            <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            <span class="hidden sm:inline">下载</span>
        </button>
        <button type="button" class="px-3 py-1.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition-colors" onclick="window.toggleSelectMode && window.toggleSelectMode()">取消选择</button>
        <button type="button" id="select-mode-fab-delete" class="px-3 py-2 sm:px-4 rounded-lg bg-red-500 hover:bg-red-600 text-white text-sm font-medium transition-colors flex items-center gap-1.5" onclick="window.confirmDeleteSelected && window.confirmDeleteSelected()">
            <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            <span class="hidden sm:inline">删除</span>
        </button>
    </div>
</div>

<!-- 通用操作加载提示（批量下载/删除/移动时显示，阻止其他操作） -->
<div id="operation-loading-overlay" class="hidden fixed inset-0 z-[110] flex items-center justify-center bg-black/40">
    <div class="bg-white rounded-xl shadow-xl px-8 py-6 flex flex-col items-center gap-4 min-w-[220px]">
        <svg class="w-10 h-10 animate-spin text-slate-500" fill="none" viewBox="0 0 24 24" aria-hidden="true">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <p id="operation-loading-message" class="text-sm font-medium text-slate-700">请稍候...</p>
    </div>
</div>

<!-- 大图预览模态框 -->
<div id="modal" class="fixed inset-0 z-50" role="dialog" aria-modal="true" aria-labelledby="modal-image-counter" aria-hidden="true" onclick="closeModal(event)">
    <div id="modal-overlay" class="absolute inset-0 bg-black/80 flex flex-row">
        <!-- 左侧：主内容区（点击空白区域关闭） -->
        <div class="flex-1 min-w-0 relative flex items-center justify-center" onclick="handleModalContentClick(event)">
        <!-- 顶部工具栏 -->
        <div id="modal-toolbar" class="absolute top-0 left-0 right-0 flex items-center justify-between p-3 md:p-4 z-10" onclick="event.stopPropagation()">
            <!-- 左侧：幻灯片控件 -->
            <div class="flex items-center gap-2">
                <button type="button" id="slideshow-btn" onclick="toggleSlideshow(); event.stopPropagation();"
                        class="p-2 h-8 rounded-full bg-white/15 hover:bg-white/30 text-white/80 hover:text-white transition-all flex items-center justify-center"
                        title="幻灯片播放" aria-label="幻灯片播放">
                    <!-- 播放图标 -->
                    <svg id="slideshow-play-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    <!-- 暂停图标 -->
                    <svg id="slideshow-pause-icon" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                </button>
                <!-- 间隔设置 -->
                <div class="relative flex items-center" id="slideshow-interval-wrapper">
                    <button type="button" id="slideshow-interval-btn" onclick="toggleSlideshowInterval(); event.stopPropagation();"
                            class="p-2 min-w-[2rem] h-8 rounded-full bg-white/15 hover:bg-white/30 text-white/80 hover:text-white text-xs font-medium transition-all flex items-center justify-center"
                            title="播放间隔" aria-label="播放间隔">
                        <span id="slideshow-interval-label">2s</span>
                    </button>
                    <div id="slideshow-interval-popover" class="hidden absolute left-0 top-full mt-2 p-3 bg-slate-800/95 backdrop-blur rounded-lg shadow-xl border border-white/10 min-w-[200px]">
                        <div class="text-xs text-white/60 mb-2">播放间隔</div>
                        <input type="range" id="slideshow-interval-slider" min="1" max="10" step="0.5" value="2"
                               class="w-full h-1.5 bg-white/20 rounded-lg appearance-none cursor-pointer accent-blue-400"
                               oninput="updateSlideshowInterval(this.value)">
                        <div class="flex justify-between text-xs text-white/50 mt-1">
                            <span>1s</span>
                            <span id="slideshow-interval-value">2 秒</span>
                            <span>10s</span>
                        </div>
                        <div class="text-xs text-white/60 mt-3 mb-1">播放结束</div>
                        <div class="flex gap-2">
                            <button type="button" class="slideshow-mode-btn flex-1 px-2 py-1.5 rounded text-xs font-medium transition-colors" data-mode="loop" title="循环播放" onclick="setSlideshowMode('loop'); event.stopPropagation();">循环</button>
                            <button type="button" class="slideshow-mode-btn flex-1 px-2 py-1.5 rounded text-xs font-medium transition-colors" data-mode="stop" title="最后一张自动停止" onclick="setSlideshowMode('stop'); event.stopPropagation();">停止</button>
                        </div>
                    </div>
                </div>
                <!-- 视频自动播放下一个 -->
                <button type="button" id="video-autoplay-next-btn" onclick="toggleVideoAutoPlayNext(); event.stopPropagation();"
                        class="p-2 h-8 rounded-full bg-white/15 hover:bg-white/30 text-white/80 hover:text-white transition-all flex items-center justify-center"
                        title="视频播完后自动切换下一个" aria-label="视频播完后自动切换下一个">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                </button>
            </div>
            <!-- 右侧：工具栏（可展开收起） -->
            <div class="flex items-center gap-2">
                <button type="button" id="modal-info-btn" onclick="toggleImageInfo(); event.stopPropagation();"
                        class="p-2 h-8 rounded-full bg-white/15 hover:bg-white/30 text-white/80 hover:text-white transition-all flex-shrink-0 flex items-center justify-center"
                        title="图片信息" aria-label="图片信息">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                </button>
                <button type="button" id="modal-toolbar-toggle" onclick="toggleModalToolbar(); event.stopPropagation();"
                        class="p-2 h-8 rounded-full bg-white/15 hover:bg-white/30 text-white/80 hover:text-white transition-all flex-shrink-0 flex items-center justify-center"
                        title="展开/收起工具栏" aria-label="展开或收起工具栏">
                    <svg id="modal-toolbar-expand-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
                    <svg id="modal-toolbar-collapse-icon" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
                </button>
                <div id="modal-toolbar-buttons" class="flex items-center gap-2 overflow-hidden max-w-[999px] opacity-100 transition-all duration-200">
                <button type="button" id="modal-fullscreen-btn" onclick="toggleModalFullscreen(); event.stopPropagation();"
                        class="p-2 h-8 rounded-full bg-white/15 hover:bg-white/30 text-white/80 hover:text-white transition-all flex items-center justify-center"
                        title="全屏查看 (F)" aria-label="全屏查看">
                    <!-- 进入全屏图标 -->
                    <svg id="fullscreen-enter-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
                    <!-- 退出全屏图标 -->
                    <svg id="fullscreen-exit-icon" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 9L4 4m5 0H4v5m16-5l-5 5m5-5h-5v5M4 20l5-5m-5 5h5v-5m11 5l-5-5m5 5h-5v-5"/></svg>
                </button>
                <button type="button" id="modal-move-btn" onclick="window.showMoveDialogForCurrentImage && window.showMoveDialogForCurrentImage(); event.stopPropagation();"
                        class="p-2 h-8 rounded-full bg-white/15 hover:bg-white/30 text-white/80 hover:text-white transition-all flex items-center justify-center"
                        title="移动到其他文件夹" aria-label="移动到其他文件夹">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
                </button>
                <button type="button" id="modal-rename-btn" onclick="window.showRenameDialogForCurrentImage && window.showRenameDialogForCurrentImage(); event.stopPropagation();"
                        class="p-2 h-8 rounded-full bg-white/15 hover:bg-white/30 text-white/80 hover:text-white transition-all flex items-center justify-center"
                        title="重命名当前图片" aria-label="重命名当前图片">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                </button>
                <button type="button" id="modal-download-btn" onclick="downloadCurrentImage(); event.stopPropagation();"
                        class="p-2 h-8 rounded-full bg-white/15 hover:bg-white/30 text-white/80 hover:text-white transition-all flex items-center justify-center"
                        title="下载当前图片" aria-label="下载当前图片">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                </button>
                <div class="relative" id="modal-set-folder-thumb-wrapper">
                    <button type="button" id="modal-set-folder-thumb-btn" onclick="window.toggleSetThumbnailPopover && window.toggleSetThumbnailPopover(); event.stopPropagation();"
                            class="p-2 h-8 rounded-full bg-white/15 hover:bg-white/30 text-white/80 hover:text-white transition-all flex items-center justify-center"
                            title="设为文件夹缩略图" aria-label="设为文件夹缩略图">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                    </button>
                    <div id="set-thumbnail-popover" class="hidden fixed py-1 bg-slate-800/95 backdrop-blur rounded-lg shadow-xl border border-white/10 min-w-[180px] z-[110]">
                        <button type="button" class="set-thumbnail-option w-full text-left px-3 py-2 text-sm text-white/90 hover:bg-white/10 transition-colors flex items-center gap-2" data-action="parent" onclick="window.handleSetThumbnailOption && window.handleSetThumbnailOption('parent'); event.stopPropagation();">设为父文件夹缩略图</button>
                        <button type="button" class="set-thumbnail-option w-full text-left px-3 py-2 text-sm text-white/90 hover:bg-white/10 transition-colors flex items-center gap-2" data-action="browse" onclick="window.handleSetThumbnailOption && window.handleSetThumbnailOption('browse'); event.stopPropagation();">浏览</button>
                    </div>
                </div>
                <button type="button" id="modal-delete-btn" onclick="deleteCurrentImage(); event.stopPropagation();"
                        class="p-2 h-8 rounded-full bg-white/15 hover:bg-red-500/80 text-white/80 hover:text-white transition-all flex items-center justify-center"
                        title="删除当前图片" aria-label="删除当前图片">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                </button>
                <button type="button" id="modal-close-btn" onclick="closeModalAndStopSlideshow(); event.stopPropagation();"
                        class="p-2 h-8 rounded-full bg-white/15 hover:bg-white/30 text-white/80 hover:text-white transition-all flex-shrink-0 flex items-center justify-center"
                        title="关闭" aria-label="关闭预览">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
                </div>
            </div>
        </div>
        <button type="button" id="modal-prev-btn" onclick="prevImage(); event.stopPropagation();" class="absolute left-2 sm:left-4 top-1/2 -translate-y-1/2 w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-white/20 hover:bg-white/40 text-white text-xl sm:text-2xl flex items-center justify-center" aria-label="上一张">‹</button>
        <img id="modal-img" src="" alt="" class="max-w-[90vw] max-h-[90vh] object-contain" onclick="event.stopPropagation()">
        <video id="modal-video" class="max-w-[90vw] max-h-[90vh] object-contain hidden" controls onclick="event.stopPropagation()"></video>
        <button type="button" id="modal-next-btn" onclick="nextImage(); event.stopPropagation();" class="absolute right-2 sm:right-4 top-1/2 -translate-y-1/2 w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-white/20 hover:bg-white/40 text-white text-xl sm:text-2xl flex items-center justify-center" aria-label="下一张">›</button>
        <div id="modal-image-counter" class="absolute bottom-4 left-1/2 -translate-x-1/2 px-3 py-1.5 rounded-full bg-black/50 text-white/90 text-sm font-medium" onclick="event.stopPropagation()">1/1</div>
        </div>
        <!-- 右侧：图片信息面板（由「图片信息」按钮开关；移动端为底部抽屉） -->
        <div id="modal-image-info-panel" class="hidden flex-shrink-0 w-72 h-full bg-black/60 backdrop-blur border-l border-white/10 flex flex-col overflow-hidden fixed inset-x-0 bottom-0 max-h-[50vh] w-full border-t border-white/10 md:static md:max-h-none md:border-t-0 md:w-72" onclick="event.stopPropagation()">
            <div id="image-info-content" class="flex-1 p-4 text-sm text-white/90 space-y-3 font-mono overflow-y-auto">
                <div class="text-white/50">加载中...</div>
            </div>
        </div>
    </div>
</div>

<script src="/static/js/gallery.js" defer></script>
{% endblock %}
