# =============================================================================
# 可用环境变量（可通过 .env 或 export 设置）
# =============================================================================
#
# 通用
#   PUID              容器内运行用户 UID，默认 1000
#   PGID              容器内运行用户 GID，默认 1000
#   TZ                时区，默认 Asia/Shanghai
#
# FastPic 应用
#   ACCESS_PASSWORD           访问密码，默认 0928
#   MAX_UPLOAD_FILE_SIZE      单文件上传上限，默认 1000M
#   MAX_UPLOAD_TOTAL_SIZE     总上传上限，默认 5000M
#   DB_POOL_SIZE              数据库连接池大小，默认 10，百万级建议 20
#   DB_MAX_OVERFLOW           连接池最大溢出，默认 20，百万级建议 40
#   DB_POOL_RECYCLE           连接回收间隔（秒），默认 3600，应小于 MariaDB wait_timeout
#   SKIP_FULL_SCAN_ON_STARTUP 启动时是否跳过完整扫描，默认 false
#
# 系统限制（通过 docker-compose.yml 设置）
#   inotify max_user_watches  文件监控数量，默认 8192，十万级图片建议 524288（需要宿主机设置，容器内无法修改）
#
# MariaDB 数据库
#   MYSQL_ROOT_PASSWORD       root 密码，默认 fastpic
#   MYSQL_DATABASE            数据库名，默认 fastpic
#   MYSQL_USER                数据库用户，默认 fastpic
#   MYSQL_PASSWORD            数据库密码，默认 fastpic
#   MARIADB_BUFFER_POOL_SIZE  InnoDB 缓冲池大小，默认 4028M
#   MARIADB_LOG_FILE_SIZE     InnoDB 日志文件大小，默认 512M
#
# =============================================================================

services:
  mariadb:
    image: mariadb:11
    container_name: fastpic-mariadb
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-fastpic}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fastpic}
      MYSQL_USER: ${MYSQL_USER:-fastpic}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fastpic}
    # 性能调优：可通过 MARIADB_BUFFER_POOL_SIZE、MARIADB_LOG_FILE_SIZE 覆盖
    command:
      - mariadbd
      - --innodb-buffer-pool-size=${MARIADB_BUFFER_POOL_SIZE:-4028M}
      - --innodb-log-file-size=${MARIADB_LOG_FILE_SIZE:-512M}
      - --transaction-isolation=READ-COMMITTED
    volumes:
      - /home/syaofox/Downloads/fastpic/data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  fastpic:
    build:
      context: .
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    image: fastpic:prod
    container_name: fastpic
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "8000:8000"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - ACCESS_PASSWORD=${ACCESS_PASSWORD:-0928}
      - MAX_UPLOAD_FILE_SIZE=${MAX_UPLOAD_FILE_SIZE:-1000M}
      - MAX_UPLOAD_TOTAL_SIZE=${MAX_UPLOAD_TOTAL_SIZE:-5000M}
      - SKIP_FULL_SCAN_ON_STARTUP=${SKIP_FULL_SCAN_ON_STARTUP:-true}
      - MYSQL_HOST=mariadb
      - MYSQL_USER=${MYSQL_USER:-fastpic}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-fastpic}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-fastpic}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-20}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-40}
      - DB_POOL_RECYCLE=${DB_POOL_RECYCLE:-3600}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /home/syaofox/Downloads/fastpic/cache:/app/cache
      - /home/syaofox/Downloads/fastpic/photos:/app/photos