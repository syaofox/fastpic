services:
  mariadb:
    image: mariadb:11
    container_name: fastpic-mariadb
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-fastpic}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fastpic}
      MYSQL_USER: ${MYSQL_USER:-fastpic}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fastpic}
    # 性能调优：可通过 MARIADB_BUFFER_POOL_SIZE、MARIADB_LOG_FILE_SIZE 覆盖
    command:
      - mariadbd
      - --innodb-buffer-pool-size=${MARIADB_BUFFER_POOL_SIZE:-4028M}
      - --innodb-log-file-size=${MARIADB_LOG_FILE_SIZE:-512M}
      - --transaction-isolation=READ-COMMITTED
    volumes:
      - ./data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  fastpic:
    build:
      context: .
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    container_name: fastpic
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "8000:8000"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - ACCESS_PASSWORD=${ACCESS_PASSWORD:-0928}
      - MAX_UPLOAD_FILE_SIZE=${MAX_UPLOAD_FILE_SIZE:-1000M}
      - MAX_UPLOAD_TOTAL_SIZE=${MAX_UPLOAD_TOTAL_SIZE:-5000M}
      - MYSQL_HOST=mariadb
      - MYSQL_USER=${MYSQL_USER:-fastpic}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-fastpic}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-fastpic}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      # - ./data:/app/data
      - ./cache:/app/cache
      - ./photos:/app/photos

