# =============================================================================
# 本地开发用 MariaDB - 仅启动数据库，便于调试
# =============================================================================
#
# 用法：
#   docker compose -f docker-compose.dev.yml up -d
#
# 连接信息（与主 compose 一致）：
#   Host: localhost
#   Port: 3306
#   User: fastpic
#   Password: fastpic
#   Database: fastpic
#
# 本地启动 FastPic 时设置：
#   export MYSQL_HOST=127.0.0.1
#   uv run uvicorn main:app --host 0.0.0.0 --port 8000 --reload
#
# =============================================================================

services:
  mariadb:
    image: mariadb:11
    container_name: fastpic-mariadb-dev
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-fastpic}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fastpic}
      MYSQL_USER: ${MYSQL_USER:-fastpic}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fastpic}
    # 开发环境用较小缓冲，节省内存
    command:
      - mariadbd
      - --innodb-buffer-pool-size=256M
      - --transaction-isolation=READ-COMMITTED
    volumes:
      - ./data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 5
